# Tests and build (ADR 0011 of the back repository): on every pull request, and on develop so that the
# develop → main pull request, opened by the GITHUB_TOKEN (which triggers no pull_request workflow), shows the
# checks of its head commit.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
