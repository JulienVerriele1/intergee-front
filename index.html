<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Intergee met en relation des étudiants et des personnes âgées ou en situation de handicap pour des services de proximité." />
    <meta name="theme-color" content="#0e6b62" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131a1c" media="(prefers-color-scheme: dark)" />
    <!-- Atkinson Hyperlegible Next: designed by the Braille Institute for low-vision readers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Intergee</title>
    <!-- Theme before the first paint (no flash): the visitor's choice, else the system setting. See useTheme.js -->
    <script>
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('intergee-theme')
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body class="bg-surface font-sans text-ink antialiased">
    <div id="app"></div>
    <noscript>Intergee nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
